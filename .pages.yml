media: 
  input: src/images
  output: docs/images
content:
  - name: course
    label: New Courses
    type: collection
    path: src/courses
  - name: Test
    label: Tests
    type: collection
    path: src/tests
    view: 
      fields: ["CourseName","DevCycle"]
      primary: CourseName
      sort: ["DevCycle","CourseName"]
      default: 
        order: desc
    fields: 
      - { name: CourseName, label: Course Name, type: string }
      - name: Programs
        label: programs
        type: select
        options:
          multiple: true
          values: [IB, HSM]
      - { name: DevCycle, label: Development Cycle, type: number }
      - { name: Blueprint, label: Blueprint, type: string }
      - { name: Description, label: Course Description, type: text }
 