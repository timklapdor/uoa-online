media: 
  input: src/images
  output: docs/images
content:
  - name: courses
    label: Courses 
    type: collection
    path: src/courses
    view: 
      fields: [ CourseName, DevCycle ]
      sort: DevCycle
      order: desc
    fields: 
      - { name: CourseName, label: Course Name, type: string }
      - name: Programs
        label: programs
        type: select
        options:
          multiple: true
          values: [IB, HSM]
      - { name: DevCycle, label: Development Cycle, type: number }
      - { name: Blueprint, label: Blueprint, type: string }
      - { name: Description, label: Course Description, type: rich-text }
      - name: team
        label: Team
        type: object
        list: true
        fields: 
          - name: Name
            label: Name
            type: string
          - name: Role
            label: Role
            type: select
            options: 
              values: [Course Author, Learning Designer, Digital Education Developer]
          - name: Involvement
            label: Involvement
            type: select
            options: 
              values: [Lead, Collaborator, Contributer]
      - name: CLOs
        label: Course Learning Outcomes
        type: text
        list: true
        options: 
          autoresize: true